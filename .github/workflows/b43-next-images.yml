# Fork only: builds the kmod-b43-next images for all the ASUS bcm53xx routers this branch supports and publishes them as a pre-release
name: b43-next images

on:
  push:
    branches: [b43-next-all]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b43-next-images
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af >/dev/null
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget zstd

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cat > .config <<'CFG'
          CONFIG_TARGET_bcm53xx=y
          CONFIG_TARGET_bcm53xx_generic=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_PER_DEVICE_ROOTFS=y
          CONFIG_TARGET_DEVICE_bcm53xx_generic_DEVICE_asus_rt-ac56u=y
          CONFIG_TARGET_DEVICE_bcm53xx_generic_DEVICE_asus_rt-ac68u=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_iperf3=y
          CFG
          make defconfig
          grep -E "^CONFIG_PACKAGE_(kmod-b43-next|b43-firmware[^=]*|luci)=" .config

      - name: Download
        run: make download -j8 || make download -j1 V=s

      - name: Build
        run: make -j$(($(nproc) + 1)) || make -j1 V=s

      - name: Collect
        id: collect
        run: |
          d=bin/targets/bcm53xx/generic
          mkdir out
          cp $d/*asus_rt-ac56u*.trx $d/*asus_rt-ac68u*.trx $d/*.manifest $d/config.buildinfo $d/feeds.buildinfo $d/version.buildinfo out/ 2>/dev/null || true
          (cd out && sha256sum * > sha256sums)
          ls -la out
          echo "tag=b43-next-$(date -u +%Y%m%d)-$(git rev-parse --short=10 HEAD)" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: b43-next-images
          path: out/

      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -e "s/@SHA@/$(git rev-parse --short=10 HEAD)/" \
            .github/b43-next-release.md > notes.md
          gh release create "${{ steps.collect.outputs.tag }}" out/* --prerelease --target "$GITHUB_SHA" \
            --title "ASUS RT-AC56U / RT-AC68U family: OpenWrt with b43-next (${{ steps.collect.outputs.tag }})" --notes-file notes.md
